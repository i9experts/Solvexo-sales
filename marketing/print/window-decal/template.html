<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Solvexo Window Decal</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(FONTS/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(FONTS/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(FONTS/poppins-latin-700-normal.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(FONTS/poppins-latin-800-normal.woff2)}
@font-face{font-family:Nastaliq;font-weight:700;src:url(FONTS/noto-nastaliq-urdu-arabic-700-normal.woff2)}
:root{--t:#D97757;--c:#F59373;--r:#B85C3E;--ink:#1F1A17;--paper:#FFFFFF;--sand:#F7ECE5;--mute:#5E534D;--line:#EAD9CF}
/* 6 x 6 in (152.4 mm) + 3 mm bleed = 158.4 mm square. Cut line: 152.4 mm square, 8 mm corner radius. */
@page{size:158.4mm 158.4mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:158.4mm;height:158.4mm;position:relative;overflow:hidden;background:var(--t)}
/* white card inside a terracotta frame; frame runs into the bleed */
.card{position:absolute;left:9mm;top:9mm;width:140.4mm;height:140.4mm;background:var(--paper);border-radius:6mm;overflow:hidden}
.head{position:absolute;left:0;right:0;top:0;height:38mm;padding:6mm 7mm 0;text-align:center}
.pill{display:inline-block;background:var(--ink);color:#fff;font-weight:700;font-size:6.4pt;letter-spacing:.16em;padding:1mm 3mm;border-radius:3mm}
.h{font-weight:800;font-size:20pt;line-height:1.05;letter-spacing:-.015em;margin-top:2.2mm}
.h span{color:var(--t)}
.ur{font-family:Nastaliq,serif;font-weight:700;direction:rtl;unicode-bidi:isolate;font-size:10.5pt;line-height:2;margin-top:.4mm}
.qrbox{position:absolute;left:50%;top:40mm;transform:translateX(-50%);width:70mm;height:70mm;padding:4mm;background:#fff;border-radius:3mm;box-shadow:0 0 0 .6mm var(--line)}
.qrbox img{width:100%;height:100%;display:block}
.cn{position:absolute;width:8mm;height:8mm;border:1.3mm solid var(--t)}
.cn.a{left:-2mm;top:-2mm;border-right:none;border-bottom:none;border-radius:2.5mm 0 0 0}
.cn.b{right:-2mm;top:-2mm;border-left:none;border-bottom:none;border-radius:0 2.5mm 0 0}
.cn.c{left:-2mm;bottom:-2mm;border-right:none;border-top:none;border-radius:0 0 0 2.5mm}
.cn.d{right:-2mm;bottom:-2mm;border-left:none;border-top:none;border-radius:0 0 2.5mm 0}
.under{position:absolute;left:6mm;right:6mm;top:114mm;text-align:center}
.store{font-weight:700;font-size:9pt;color:var(--mute)}
.url{font-weight:800;font-size:11pt;color:var(--ink);margin-top:.6mm;letter-spacing:-.005em}
.foot{position:absolute;left:0;right:0;bottom:0;height:10mm;background:var(--sand);display:flex;align-items:center;justify-content:center;gap:1.6mm;font-size:6.2pt;color:var(--mute)}
.foot img{height:4.4mm}
.foot b{color:var(--ink)}
</style></head>
<body>
<div class="sheet">
  <div class="card">
    <div class="head">
      <span class="pill">WE’RE ONLINE</span>
      <p class="h">Order online, <span>anytime.</span></p>
      <p class="ur">آن لائن آرڈر کریں — کسی بھی وقت</p>
    </div>
    <div class="qrbox"><span class="cn a"></span><span class="cn b"></span><span class="cn c"></span><span class="cn d"></span><img src="{{QR_FILE}}" alt="QR code to {{STORE_URL_TEXT}}"></div>
    <div class="under">
      <p class="store">{{STORE_NAME}}</p>
      <p class="url">{{STORE_URL_TEXT}}</p>
    </div>
    <div class="foot"><img src="ICON" alt=""><span>Powered by <b>Solvexo</b></span></div>
  </div>
</div>
</body></html>
