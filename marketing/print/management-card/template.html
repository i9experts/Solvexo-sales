<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Solvexo Management Card</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(FONTS/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(FONTS/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(FONTS/poppins-latin-700-normal.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(FONTS/poppins-latin-800-normal.woff2)}
:root{--t:#D97757;--c:#F59373;--r:#B85C3E;--ink:#1F1A17;--soft:#E3D5CC}
/* 3.5 x 2 in (88.9 x 50.8 mm) + 3 mm bleed = 94.9 x 56.8 mm. Safe area 7 mm from sheet edge. */
@page{size:94.9mm 56.8mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{width:94.9mm;height:56.8mm;position:relative;overflow:hidden;page-break-after:always}
/* FRONT: dark, the person */
.front{background:var(--ink);color:#fff}
.front .strip{position:absolute;right:0;top:0;bottom:0;width:7.5mm;background:var(--t)}
.front .strip i{position:absolute;left:2.2mm;top:7mm;width:3mm;height:3mm;border-radius:.8mm;background:var(--c)}
.front .logo{position:absolute;left:7mm;top:7mm;height:5.4mm}
.front .name{position:absolute;left:7mm;top:17.6mm;right:14mm;font-weight:800;font-size:12.5pt;line-height:1.1;letter-spacing:-.01em}
.front .title{position:absolute;left:7mm;top:24.4mm;font-weight:600;font-size:6pt;letter-spacing:.16em;color:var(--c)}
.front .ct{position:absolute;left:7mm;bottom:6.6mm;right:14mm;display:flex;flex-direction:column;gap:1.1mm}
.front .ln{display:flex;align-items:center;gap:1.8mm;font-size:6.4pt;color:var(--soft)}
.front .ln i{width:3.6mm;height:3.6mm;border-radius:1mm;background:#2E2622;display:flex;align-items:center;justify-content:center;flex:none}
.front .ln b{color:#fff;font-weight:600}
/* BACK: terracotta, the brand */
.back{background:var(--t)}
.back .d1{position:absolute;left:-14mm;top:-16mm;width:44mm;height:44mm;border-radius:10mm;background:var(--c);opacity:.55}
.back .d2{position:absolute;right:-10mm;bottom:-12mm;width:30mm;height:30mm;border-radius:7mm;background:var(--r);opacity:.45}
.back .tile{position:absolute;left:12mm;top:10mm;width:22mm;height:22mm;border-radius:5mm;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 .8mm 2mm rgba(31,26,23,.15)}
.back .tile img{width:16mm;height:16mm}
.back .wm{position:absolute;left:12mm;top:36mm;font-weight:700;font-size:6pt;letter-spacing:.16em;color:var(--ink)}
.back .site{position:absolute;left:12mm;top:40mm;font-weight:800;font-size:8.6pt;color:#fff}
.back .qr{position:absolute;right:7mm;top:9.5mm;width:27mm;background:#fff;border-radius:2mm;padding:1.8mm;text-align:center}
.back .qr img{width:23.4mm;height:23.4mm;display:block}
.back .qr span{display:block;font-weight:700;font-size:4.6pt;letter-spacing:.1em;color:var(--r);margin-top:.9mm}
/* SPOT UV mask: black = varnish */
.mask{background:#fff}
.mask .icon{position:absolute;left:12mm;top:10mm;width:22mm;height:22mm;border-radius:5mm;background:#000}
.mask .logo{position:absolute;left:7mm;top:7mm;width:30mm;height:5.4mm;background:#000;border-radius:.8mm}
.mask p{position:absolute;left:3mm;bottom:2mm;font-size:4pt;color:#999}
svg{display:block}
</style></head>
<body>

<div class="card front">
  <div class="strip"><i></i></div>
  <img class="logo" src="LOGO_LIGHT" alt="Solvexo">
  <p class="name">{{NAME}}</p>
  <p class="title">{{TITLE}}</p>
  <div class="ct">
    <div class="ln"><i><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#F59373" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></i><b>{{PHONE}}</b></div>
    <div class="ln"><i><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#F59373" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></i><span>{{EMAIL}}</span></div>
    <div class="ln"><i><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#F59373" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></i><span>solvexo.store</span></div>
    {{LINKEDIN_LINE}}
  </div>
</div>

<div class="card back">
  <div class="d1"></div><div class="d2"></div>
  <div class="tile"><img src="ICON" alt="Solvexo"></div>
  <p class="wm">CREATE · SELL · MANAGE · GROW</p>
  <p class="site">solvexo.store</p>
  <div class="qr"><img src="{{QR_FILE}}" alt="QR: save contact {{NAME}}"><span>SAVE MY CONTACT</span></div>
</div>

<div class="card mask">
  <div class="icon"></div>
  <p>SPOT UV MASK · BACK · black = gloss varnish (icon)</p>
</div>

<div class="card mask">
  <div class="logo"></div>
  <p>SPOT UV MASK · FRONT · black = gloss varnish (logo)</p>
</div>

</body></html>
