<!doctype html><html><head><meta charset="utf-8"><title>Solvexo Lanyard</title>
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(../tent-card/fonts/poppins-latin-700-normal.woff2)}
/* One side of a 20 mm lanyard, 450 mm repeat tile (printer repeats it along the strap). */
@page{size:20mm 450mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.strip{width:20mm;height:450mm;background:#D97757;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:6mm 0}
.u{display:flex;flex-direction:column;align-items:center;gap:3mm}
.u img{width:9mm;height:9mm;border-radius:2mm;background:#fff;padding:.6mm}
.u span{writing-mode:vertical-rl;font-family:Poppins;font-weight:700;font-size:8pt;letter-spacing:.18em;color:#fff}
</style></head><body><div class="strip">
<div class="u"><img src="icon.png" alt=""><span>SOLVEXO</span></div>
<div class="u"><img src="icon.png" alt=""><span>SOLVEXO.STORE</span></div>
<div class="u"><img src="icon.png" alt=""><span>SOLVEXO</span></div>
<div class="u"><img src="icon.png" alt=""><span>SOLVEXO.STORE</span></div>
</div></body></html>
